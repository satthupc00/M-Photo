name: Build APK

on:
  push:
    branches: ["**", "!dist"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KS: ${{ secrets.MPHOTO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p keystore && echo "$KS" | base64 -d > keystore/mphoto.jks && echo "MPHOTO_SIGNED=true" >> $GITHUB_ENV; else echo "::warning::No signing key secret, using debug key"; fi
      - name: Build release APK
        env:
          MPHOTO_KEY_PASSWORD: ${{ secrets.MPHOTO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MPhoto-v${VER}.apk"
          echo "VER=${VER}" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: MPhoto-v${{ env.VER }}
          path: out/*.apk
      - name: Check if this version is already released
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VER}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Mirror APK to dist branch (CDN jsDelivr)
        if: steps.rel.outputs.exists == 'false' && env.MPHOTO_SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dist && cp out/*.apk /tmp/dist/ && cd /tmp/dist
          git init -q -b dist
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "dist v${VER}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dist
      - name: Publish GitHub Release (new version only)
        if: steps.rel.outputs.exists == 'false' && env.MPHOTO_SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: M Photo v${{ env.VER }}
          body_path: release-notes.md
          files: out/*.apk
          make_latest: true
