<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M Photo Files</title>
<style>
:root{--chrome:#1F2126;--panel:#26292F;--line:#363A42;--hover:#2F333A;--stage:#2B2D31;--text:#E8E9EC;--muted:#8D929C;--red:#E5383B;--selected-bg:#3A2426;--green:#3DDC8A;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;background:#15161A;color:var(--text);font:14px/1.4 "Segoe UI",system-ui,Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button{transition:background-color .12s,color .12s,transform .22s var(--ease)}
button:active{transform:scale(.95)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.page{padding:18px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ptitle{font-weight:700;font-size:17px}.ptitle .m{color:var(--red)}
.pnote{color:var(--muted);font-size:13px;text-align:center;max-width:760px}
.stage{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;align-items:flex-start;width:100%}
.devwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.devlabel{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em}
.scaler{transform-origin:top left}
.device{background:#000;border-radius:34px;padding:9px;box-shadow:0 0 0 2px #2c2e34,0 20px 50px rgba(0,0,0,.5)}
.screen{position:relative;overflow:hidden;border-radius:26px;background:var(--chrome)}
.outer .screen{width:384px;height:896px}.inner .screen{width:820px;height:740px}
.sb{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;font-weight:600;color:#cfd2d8}
.app{position:absolute;inset:28px 0 0 0;display:flex;flex-direction:column}
.inner .app{flex-direction:row}
.top{height:52px;display:flex;align-items:center;padding:0 6px 0 16px;flex:0 0 auto}
.top .t{flex:1;font-size:20px;font-weight:700}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#cfd2d8}
.ib:hover{background:var(--hover)}
.latest{font-size:10.5px;font-weight:800;color:#2EB872;background:#2eb87224;padding:1px 7px;border-radius:20px;margin-right:6px}
.seg{display:flex;margin:0 14px 10px;background:var(--panel);border-radius:12px;padding:3px;flex:0 0 auto}
.seg button{flex:1;padding:8px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px}
.seg button.on{background:var(--selected-bg);color:#fff;box-shadow:inset 0 0 0 1px var(--red)}
.chips{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.chip{padding:5px 11px;border-radius:14px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{color:#FF8A8C;border-color:#5a2a2c;background:rgba(229,56,59,.13)}
.body{flex:1;min-height:0;overflow-y:auto;padding:0 8px 90px;scrollbar-width:thin;scrollbar-color:#3a3e46 transparent}
.sect{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:12px 8px 6px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:12px;text-align:left}
.row:hover{background:var(--panel);box-shadow:inset 3px 0 0 var(--red)}
.fi{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;font-size:10px;font-weight:800;color:#fff;position:relative;overflow:hidden}
.fi svg{width:22px;height:22px}
.tx{flex:1;min-width:0}.tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx b .new{display:inline;font-size:10px;font-weight:800;color:var(--green);background:rgba(61,220,138,.12);padding:1px 6px;border-radius:8px;margin-left:6px}
.crumbs{display:flex;gap:2px;align-items:center;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.crumb{padding:5px 9px;border-radius:14px;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}.crumb.cur{background:var(--panel);color:#fff}
.store{margin:0 14px 8px;background:var(--panel);border-radius:14px;padding:12px 14px;flex:0 0 auto}
.store b{font-size:14px}.store span{color:var(--muted);font-size:12px;float:right}
.bar{height:6px;border-radius:3px;background:#474C55;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:62%;background:var(--red)}
.sortbar{display:flex;align-items:center;gap:6px;padding:0 14px 6px;color:var(--muted);font-size:12px;flex:0 0 auto}
.sortbar .sp{flex:1}
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:rgba(31,33,38,.96);border-top:1px solid var(--line);display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.nav button.on{color:#fff}.nav button.on svg{color:var(--red)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--red);border-radius:2px}
.credit{position:absolute;right:10px;bottom:70px;font-size:10.5px;color:#7B808A;background:rgba(31,33,38,.85);padding:2px 8px;border-radius:10px}
.inner .credit{bottom:8px}
.rail{width:80px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px;flex:0 0 auto}
.rail button{width:64px;padding:9px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.rail button.on{background:var(--selected-bg);color:#fff}.rail button.on svg{color:var(--red)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.sheet .in{width:100%;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 8px 18px}
.inner .sheet{align-items:center;justify-content:center}.inner .sheet .in{width:420px;border-radius:22px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border-radius:12px;font-weight:600;text-align:left}
.act:hover{background:var(--hover)}.act.d{color:#FF8A8C}
</style>
</head>
<body>
<div class="page">
  <div class="ptitle"><span class="m">M</span> Photo · tab File (preview)</div>
  <div class="pnote">Tab mới <b>File</b> nằm giữa Thư mục và Cài đặt. Có 2 phần: <b>Gần đây</b> (file mới, file vừa tải về, chia theo ngày) và <b>Bộ nhớ</b> (duyệt mọi thư mục, mọi loại file). Bấm thử: đổi Gần đây / Bộ nhớ, bấm chip lọc, giữ lâu (hoặc ⋮) một file để xem menu.</div>
  <div class="stage" id="stage"></div>
</div>
<script>
const P={
album:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
folder:'<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
more:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
chev:'<path d="m9 18 6-6-6-6"/>',sort:'<path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h10"/><path d="M11 8h7"/><path d="M11 12h4"/>',
open:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
copy:'<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
move:'<path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1"/><path d="M2 13h10"/><path d="m9 16 3-3-3-3"/>',
edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const TYPES={pdf:['#E5383B','PDF'],zip:['#E8930A','ZIP'],apk:['#22A06B','APK'],doc:['#2F6FED','DOC'],xls:['#1E8E4E','XLS'],psd:['#2B5DCF','PSD'],spine:['#7B5CFF','SPINE'],mp3:['#C2410C','MP3'],txt:['#5A5F69','TXT']};
function icon(f){if(f.img)return `<span class="fi" style="background:linear-gradient(135deg,hsl(${f.img} 55% 50%),hsl(${(f.img+50)%360} 60% 32%))"></span>`;
 if(f.dir)return `<span class="fi" style="background:#3A3320;color:#FFC93C">${I('folder')}</span>`;
 const t=TYPES[f.t]||TYPES.txt;return `<span class="fi" style="background:${t[0]}">${t[1]}</span>`}
const RECENT=[
 {d:'Hôm nay',n:'Hop_dong_thue_nha.pdf',t:'pdf',s:'1,2 MB',time:'10:42',p:'Download',nw:1},
 {d:'Hôm nay',n:'MPhoto-v1.4.2.apk',t:'apk',s:'4,4 MB',time:'09:15',p:'Download',nw:1},
 {d:'Hôm nay',n:'character_rig_final.zip',t:'zip',s:'86 MB',time:'08:03',p:'Download',nw:1},
 {d:'Hôm nay',n:'Screenshot_20261113.png',img:210,s:'820 KB',time:'07:50',p:'DCIM/Screenshots'},
 {d:'Hôm qua',n:'boss_attack.json',t:'spine',s:'312 KB',time:'22:10',p:'Download/Spine'},
 {d:'Hôm qua',n:'concept_env_03.psd',t:'psd',s:'148 MB',time:'16:24',p:'Download'},
 {d:'Hôm qua',n:'Bang_gia_T11.xlsx',t:'xls',s:'54 KB',time:'11:02',p:'Download/Zalo'},
 {d:'7 ngày qua',n:'Feedback_GD.docx',t:'doc',s:'230 KB',time:'T2',p:'Documents'},
 {d:'7 ngày qua',n:'bgm_loop.mp3',t:'mp3',s:'3,1 MB',time:'CN',p:'Download'},
 {d:'7 ngày qua',n:'IMG_4521.jpg',img:30,s:'4,8 MB',time:'T7',p:'DCIM/Camera'},
];
const BROWSE=[
 {dir:1,n:'Android',s:'2 thư mục'},{dir:1,n:'DCIM',s:'3 thư mục'},{dir:1,n:'Documents',s:'14 mục'},{dir:1,n:'Download',s:'128 mục'},
 {dir:1,n:'Movies',s:'2 thư mục'},{dir:1,n:'Music',s:'36 mục'},{dir:1,n:'Pictures',s:'5 thư mục'},
 {n:'notes.txt',t:'txt',s:'2 KB · 02/11/2026'},{n:'backup_settings.zip',t:'zip',s:'1,1 MB · 28/10/2026'}];
class A{constructor(root,mode){this.r=root;this.m=mode;this.seg='recent';this.chip='Tất cả';this.sheet=null;
 root.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='seg')this.seg=v;if(a==='chip')this.chip=v;if(a==='more'){e.stopPropagation();this.sheet=v}if(a==='close')this.sheet=null;this.render()});
 let t;root.addEventListener('pointerdown',e=>{const r=e.target.closest('[data-lp]');if(!r)return;t=setTimeout(()=>{this.sheet=r.dataset.lp;this.render()},450)});
 root.addEventListener('pointerup',()=>clearTimeout(t));this.render()}
 rows(list,grouped){let h='',g='';for(const f of list){if(grouped&&f.d!==g){g=f.d;h+=`<div class="sect">${g}</div>`}
  h+=`<button class="row" data-lp="${f.n}">${icon(f)}<span class="tx"><b>${f.n}${f.nw?'<span class="new">MỚI</span>':''}</b><span>${f.dir?f.s:(f.s+(f.time?' · '+f.time:'')+(f.p?' · /'+f.p:''))}</span></span>${f.dir?`<span style="color:#5d626c">${I('chev')}</span>`:`<span class="ib" data-a="more" data-v="${f.n}">${I('more')}</span>`}</button>`}return h}
 content(){
  const seg=`<div class="seg"><button data-a="seg" data-v="recent" class="${this.seg==='recent'?'on':''}">Gần đây</button><button data-a="seg" data-v="browse" class="${this.seg==='browse'?'on':''}">Bộ nhớ</button></div>`;
  if(this.seg==='recent'){
   const chips=['Tất cả','Tải về','Ảnh','Video','Tài liệu','APK','File nén','Âm thanh'].map(c=>`<button class="chip ${c===this.chip?'on':''}" data-a="chip" data-v="${c}">${c}</button>`).join('');
   let list=RECENT;if(this.chip==='Tải về')list=RECENT.filter(f=>f.p.startsWith('Download'));if(this.chip==='Ảnh')list=RECENT.filter(f=>f.img);if(this.chip==='APK')list=RECENT.filter(f=>f.t==='apk');if(this.chip==='File nén')list=RECENT.filter(f=>f.t==='zip');if(this.chip==='Tài liệu')list=RECENT.filter(f=>['pdf','doc','xls','txt'].includes(f.t));if(this.chip==='Âm thanh')list=RECENT.filter(f=>f.t==='mp3');if(this.chip==='Video')list=[];
   return seg+`<div class="chips">${chips}</div><div class="body">${list.length?this.rows(list,true):'<div style="text-align:center;color:var(--muted);padding:40px">Không có file</div>'}</div>`}
  return seg+`<div class="store"><b>Bộ nhớ trong</b><span>158 GB / 256 GB</span><div class="bar"><i></i></div></div>
   <div class="crumbs"><button class="crumb cur">Bộ nhớ trong</button></div>
   <div class="sortbar">${I('sort')}<span>Tên A→Z</span><span class="sp"></span><span>Hiện file ẩn: Tắt</span></div>
   <div class="body">${this.rows(BROWSE,false)}</div>`}
 sheetHtml(){if(!this.sheet)return '';const acts=[['open','Mở bằng…'],['share','Chia sẻ'],['copy','Copy tới…'],['move','Di chuyển tới…'],['edit','Đổi tên'],['info','Thông tin'],['trash','Xoá']];
  return `<div class="sheet show" data-a="close"><div class="in"><div style="padding:6px 14px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-weight:700">${this.sheet}</div>${acts.map(([i,l])=>`<button class="act ${i==='trash'?'d':''}">${I(i)}${l}</button>`).join('')}</div></div>`}
 render(){const tabs=[['album','Album'],['folder','Thư mục'],['file','File'],['settings','Cài đặt']];
  const top=`<div class="top"><span class="t">File</span><button class="ib">${I('search')}</button><button class="ib" style="color:var(--green)">${I('refresh')}</button><span class="latest">latest</span></div>`;
  if(this.m==='outer') this.r.innerHTML=`<div class="app">${top}${this.content()}<div class="credit">Created by Mondiro</div><nav class="nav">${tabs.map(([k,l])=>`<button class="${k==='file'?'on':''}">${I(k)}${l}</button>`).join('')}</nav>${this.sheetHtml()}</div>`;
  else this.r.innerHTML=`<div class="app"><div class="rail">${tabs.map(([k,l])=>`<button class="${k==='file'?'on':''}">${I(k)}${l}</button>`).join('')}</div><div class="main">${top}${this.content()}</div><div class="credit">Created by Mondiro</div>${this.sheetHtml()}</div>`}}
const st=document.getElementById('stage');
for(const k of ['outer','inner']){const w=document.createElement('div');w.className='devwrap';
 w.innerHTML=`<div class="devlabel">${k==='outer'?'MÀN NGOÀI':'MÀN TRONG'}</div><div class="scaler"><div class="device ${k}"><div class="screen"><div class="sb"><span>9:41</span><span>5G 86%</span></div><div class="r"></div></div></div></div>`;
 st.appendChild(w);new A(w.querySelector('.r'),k)}
function fit(){const avail=Math.min(innerWidth-32,1400);const els=[...st.children];const nat=els.map(e=>e.querySelector('.device').offsetWidth+4);const tot=nat.reduce((a,b)=>a+b,0)+28;
 els.forEach((e,i)=>{let sc=1;if(tot>avail)sc=innerWidth<700?Math.min(1,avail/nat[i]):avail/tot;const s=e.querySelector('.scaler'),d=s.firstElementChild;s.style.transform=`scale(${sc})`;s.style.width=d.offsetWidth*sc+'px';s.style.height=d.offsetHeight*sc+'px'})}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
