<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/><stop offset="1" stop-color="#4B2BD6"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DCE3"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D9BFF"/><stop offset="1" stop-color="#1747B8"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DE0C2"/><stop offset="1" stop-color="#128F79"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22C3A6"/><stop offset="1" stop-color="#0B6B5A"/>
    </linearGradient>
    <radialGradient id="sun" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FF9A9C"/><stop offset=".55" stop-color="#E5383B"/><stop offset="1" stop-color="#A3161A"/>
    </radialGradient>
    <clipPath id="photo"><rect x="104" y="150" width="304" height="230" rx="18"/></clipPath>
  </defs>
  <ellipse cx="262" cy="470" rx="190" ry="20" fill="#000" opacity=".28"/>
  <!-- back card -->
  <g transform="rotate(-10 256 256)">
    <rect x="66" y="96" width="370" height="320" rx="34" fill="#2E1A8F" transform="translate(0 14)"/>
    <rect x="66" y="96" width="370" height="320" rx="34" fill="url(#back)"/>
  </g>
  <!-- front card with thickness -->
  <rect x="76" y="136" width="360" height="320" rx="34" fill="#9AA0AC"/>
  <rect x="76" y="122" width="360" height="320" rx="34" fill="url(#frame)"/>
  <g clip-path="url(#photo)">
    <rect x="104" y="150" width="304" height="230" fill="url(#sky)"/>
    <circle cx="322" cy="218" r="40" fill="url(#sun)"/>
    <path d="M104 380 L104 318 L190 236 L268 314 L308 284 L408 360 L408 380 Z" fill="url(#hill2)"/>
    <path d="M104 380 L104 346 L176 300 L250 352 L300 328 L408 380 Z" fill="url(#hill1)"/>
  </g>
  <rect x="104" y="398" width="120" height="18" rx="9" fill="#C3C7D0"/>
  <path d="M96 140 Q160 128 230 132" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7" fill="none"/>
</svg>
